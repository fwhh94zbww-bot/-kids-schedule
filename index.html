<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わくわく こどもスケジュール</title>
<style>
:root{
  --bg:#f6f8ff;--card:#fff;--ink:#1f2740;--muted:#6b7796;--line:#dbe3ff;
  --pink:#ff7eb6;--sky:#6cc8ff;--mint:#6ee7b7;--yellow:#ffd166;--orange:#ff9f43;--violet:#8b7cf6;
  --free:#edf1f9;
  --shadow:0 10px 28px rgba(73,92,168,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#eef3ff 0%,#f9fbff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}
.app{max-width:1100px;margin:auto;padding:12px 12px 96px}
.hero{background:linear-gradient(135deg,#7c8cff,#6cc8ff,#8b7cf6);color:#fff;border-radius:24px;padding:18px 16px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:24px}
.hero p{margin:8px 0 0;font-size:13px;opacity:.95;line-height:1.5}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-top:12px}
.grid2,.grid3,.grid4{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:900;margin:0 0 10px}
.primary{background:#5664ff;color:#fff}.secondary{background:#e9eeff;color:#3852c8}.green{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#b91c1c}.orange{background:#fff1db;color:#b45309}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tabs button{white-space:nowrap;background:#eef2ff;color:#4758c4;padding:10px 12px}.tabs .active{background:#5664ff;color:#fff}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{border-top:8px solid var(--sky)}.kid.yuina{border-top-color:var(--pink)}
.kidHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.kidHeader h2{font-size:22px;margin:0}.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#eef2ff;color:#4154d1}
.kid.yuina .badge{background:#ffe8f2;color:#d1437c}
.canvasWrap{background:radial-gradient(circle at 50% 0%,#ffffff 0%,#f7f9ff 100%);border:1px solid var(--line);border-radius:18px;padding:8px}
.chartCanvas{width:100%;height:auto;display:block}
.helper{font-size:12px;color:var(--muted);line-height:1.5}
.rows{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:8px}
.rowHead,.row{display:grid;grid-template-columns:1.15fr 1.1fr .8fr .8fr 42px;gap:6px;align-items:center;padding:8px}
.rowHead{background:#f6f8ff;color:var(--muted);font-size:11px;font-weight:800}
.row{border-top:1px solid #eef2ff;background:#fff}
.row input,.row select{padding:8px 9px;font-size:13px}
.row button{padding:8px 0;border-radius:10px;background:#fee2e2;color:#b91c1c}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.legendItem{display:flex;align-items:center;gap:8px;background:#fafbff;border:1px solid #eef2ff;border-radius:12px;padding:8px 10px;font-size:13px}
.sw{width:14px;height:14px;border-radius:50%}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:14px;font-size:12px;line-height:1.5;margin-top:8px;display:none}
.warn.show{display:block}
.preview{display:none}.preview.show{display:block}
.preview img{width:100%;border-radius:18px;border:1px solid var(--line)}
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid #dde6ff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
.footerInner{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:860px){.kids{grid-template-columns:1fr}.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.rowHead,.row{grid-template-columns:1fr 1fr .9fr .9fr 40px}}
@media (max-width:520px){.grid4,.grid3,.grid2,.legend{grid-template-columns:1fr}.hero h1{font-size:21px}.rowHead,.row{grid-template-columns:1fr 1fr .9fr .9fr 36px}.app{padding-bottom:112px}}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>🌈 わくわく こどもスケジュール</h1>
    <p>円グラフで1日がひと目で見えるよ。項目・スタート時間・所要時間を入れると、空いている時間は自動で「自由時間」になります。朝のスタートは5:00固定。</p>
  </div>

  <div class="card">
    <div class="sectionTitle"><span>基本設定</span><span class="note">端末内だけ保存</span></div>
    <div class="grid4">
      <div><label>日付</label><input id="dayDate" type="date"></div>
      <div><label>子どもAの名前</label><input id="nameA" value="ひろと"></div>
      <div><label>子どもBの名前</label><input id="nameB" value="ゆいな"></div>
      <div><label>保存済みテンプレート</label><select id="templateSelect"><option value="">テンプレートを選ぶ</option></select></div>
    </div>
    <div class="grid4" style="margin-top:10px">
      <button id="saveTemplate" class="orange">今の2人分を保存</button>
      <button id="applyTemplate" class="secondary">テンプレート適用</button>
      <button id="addWeekend" class="secondary">金・土・日を追加</button>
      <button id="clearDay" class="danger">この日をクリア</button>
    </div>
    <div class="tabs" id="dayTabs" style="margin-top:10px"></div>
  </div>

  <div class="kids" id="kidsWrap"></div>

  <div class="card preview" id="jpgPreviewWrap">
    <div class="sectionTitle"><span>📸 JPGプレビュー</span><span class="note">長押し保存OK</span></div>
    <img id="jpgPreview" alt="JPG preview">
  </div>
</div>

<div class="footer">
  <div class="footerInner">
    <button id="renderBoth" class="secondary">✨ 2人を更新</button>
    <button id="makeJpg" class="primary">📸 2人を1枚JPG</button>
  </div>
</div>

<script>
(function(){
'use strict';
const START_MIN = 5*60;
const END_MIN = 21*60;
const ACTIONS = ['起床','学校','朝食','宿題','勉強','ゲーム','遊ぶ','友達と遊ぶ','散歩','お出かけ','昼食','おやつ','夕食','お風呂','明日の準備','歯みがき','読書','お手伝い','習い事','就寝','自由時間','自由記載'];
const COLORS = {
  '起床':'#6cc8ff','学校':'#8b7cf6','朝食':'#ffd166','宿題':'#a78bfa','勉強':'#7c8cff','ゲーム':'#34d399',
  '遊ぶ':'#ff9f43','友達と遊ぶ':'#ff7eb6','散歩':'#5eead4','お出かけ':'#f97316','昼食':'#fbbf24','おやつ':'#f472b6',
  '夕食':'#fb923c','お風呂':'#60a5fa','明日の準備':'#22c55e','歯みがき':'#93c5fd','読書':'#c084fc','お手伝い':'#4ade80',
  '習い事':'#818cf8','就寝':'#64748b','自由時間':'#edf1f9','自由記載':'#94a3b8'
};
let state = { names:['ひろと','ゆいな'], activeDate:'', days:{}, templates:[] };

function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,9)}
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nextFriday(){const d=new Date();const diff=((5-d.getDay())+7)%7||7;d.setDate(d.getDate()+diff);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function timeToMin(t){const p=t.split(':');return Number(p[0])*60+Number(p[1])}
function minToTime(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function clone(x){return JSON.parse(JSON.stringify(x))}
function times(){const out=[];for(let m=START_MIN;m<=END_MIN;m+=30) out.push(minToTime(m));return out}
function durationOptions(current){const vals=[0.5,1,1.5,2,2.5,3,3.5,4];return vals.map(v=>`<option value="${v}" ${String(v)===String(current)?'selected':''}>${v===0.5?'30分':v+'時間'}</option>`).join('')}
function timeOptions(current){return times().map(t=>`<option ${t===current?'selected':''}>${t}</option>`).join('')}
function actionOptions(current){return ACTIONS.map(a=>`<option ${a===current?'selected':''}>${a}</option>`).join('')}
function colorFor(label){return COLORS[label] || '#94a3b8'}

function defaultRows(){
  return [
    {id:uid(), action:'起床', custom:'', start:'07:00', duration:'0.5'},
    {id:uid(), action:'朝食', custom:'', start:'07:30', duration:'0.5'},
    {id:uid(), action:'宿題', custom:'', start:'16:00', duration:'1'},
    {id:uid(), action:'ゲーム', custom:'', start:'17:00', duration:'0.5'},
    {id:uid(), action:'夕食', custom:'', start:'18:00', duration:'0.5'},
    {id:uid(), action:'お風呂', custom:'', start:'19:00', duration:'0.5'},
    {id:uid(), action:'就寝', custom:'', start:'21:00', duration:'0.5'}
  ];
}
function ensureDay(date){
  if(!state.days[date]) state.days[date]={kids:[{rows:defaultRows()},{rows:defaultRows()}]};
  return state.days[date];
}
function currentDay(){return ensureDay(state.activeDate)}

function normalizeRows(rows){
  const items = rows.map(r=>({
    id:r.id,
    action:r.action,
    label:(r.custom||'').trim() || r.action,
    start:Math.max(START_MIN, Math.min(END_MIN, timeToMin(r.start))),
    end:Math.max(START_MIN, Math.min(END_MIN, timeToMin(r.start) + Math.round(Number(r.duration)*60)))
  })).filter(r=>r.end>r.start).sort((a,b)=>a.start-b.start);

  let warnings=[];
  for(let i=1;i<items.length;i++){
    if(items[i].start < items[i-1].end){warnings.push(`${minToTime(items[i].start)} の「${items[i].label}」が前の予定と重なっています。`)}
  }

  let segs=[]; let cur=START_MIN;
  items.forEach(it=>{
    if(it.start>cur){segs.push({label:'自由時間',action:'自由時間',start:cur,end:it.start,color:colorFor('自由時間')});}
    const s=Math.max(cur,it.start);
    if(it.end>s){segs.push({label:it.label,action:it.action,start:s,end:it.end,color:colorFor(it.action)});cur=it.end;}
  });
  if(cur<END_MIN){segs.push({label:'自由時間',action:'自由時間',start:cur,end:END_MIN,color:colorFor('自由時間')});}
  if(items.length===0){segs=[{label:'自由時間',action:'自由時間',start:START_MIN,end:END_MIN,color:colorFor('自由時間')}];}
  return {segments:segs,warnings};
}

function segmentText(seg){return `${minToTime(seg.start)}〜${minToTime(seg.end)}　${seg.label}`}

function drawDonut(canvas, name, date, segs){
  const ctx=canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 360;
  const cssH = 360;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  const cx=cssW/2, cy=155, r=108, inner=54;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,cssH);
  ctx.fillStyle='#1f2740';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(name, cx, 26);
  ctx.fillStyle='#6b7796';ctx.font='13px sans-serif';ctx.fillText(date, cx, 46);
  let total = END_MIN-START_MIN; let angle=-Math.PI/2;
  segs.forEach(seg=>{
    const portion=(seg.end-seg.start)/total; const a2=angle + portion*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,a2); ctx.closePath();
    ctx.fillStyle=seg.color; ctx.fill(); angle=a2;
  });
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#334155'; ctx.font='bold 18px sans-serif'; ctx.fillText('1日の',cx,cy-6); ctx.font='bold 24px sans-serif'; ctx.fillText('スケジュール',cx,cy+24);
  let legendY=280;
  const shown = segs.slice(0,4);
  shown.forEach((seg,i)=>{
    const y=legendY+i*20; ctx.fillStyle=seg.color; ctx.beginPath(); ctx.arc(26,y-5,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#475569'; ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText(segmentText(seg),40,y);
  });
}

function kidCardHtml(kidIndex){
  const day=currentDay(); const kid=day.kids[kidIndex];
  const name = state.names[kidIndex]; const norm=normalizeRows(kid.rows);
  return `
  <div class="card kid ${kidIndex===1?'yuina':''}" data-kid="${kidIndex}">
    <div class="kidHeader">
      <h2>${kidIndex===0?'🚀':'🌟'} ${esc(name)}</h2>
      <span class="badge">5:00〜21:00</span>
    </div>
    <div class="canvasWrap"><canvas class="chartCanvas" id="chart-${kidIndex}"></canvas></div>
    <div class="legend">
      ${norm.segments.slice(0,8).map(seg=>`<div class="legendItem"><span class="sw" style="background:${seg.color}"></span><span>${esc(segmentText(seg))}</span></div>`).join('')}
    </div>
    <div class="warn ${norm.warnings.length?'show':''}" id="warn-${kidIndex}">${norm.warnings.join('<br>')}</div>
    <div class="sectionTitle" style="margin-top:12px"><span>予定入力</span><span class="helper">空き時間は自由時間に自動変換</span></div>
    <div class="rows">
      <div class="rowHead"><div>項目</div><div>自由記載</div><div>開始</div><div>時間</div><div></div></div>
      ${kid.rows.map(r=>`
        <div class="row" data-row="${r.id}">
          <select class="field-action">${actionOptions(r.action)}</select>
          <input class="field-custom" value="${esc(r.custom)}" placeholder="未入力なら項目名を使用">
          <select class="field-start">${timeOptions(r.start)}</select>
          <select class="field-duration">${durationOptions(r.duration)}</select>
          <button class="deleteRow">×</button>
        </div>
      `).join('')}
    </div>
    <div class="grid3" style="margin-top:10px">
      <button class="green addRow">＋予定を追加</button>
      <button class="secondary sortRows">時間順に並べる</button>
      <button class="danger clearRows">この子をクリア</button>
    </div>
  </div>`;
}

function renderTabs(){
  const dates=Object.keys(state.days).sort();
  $('dayTabs').innerHTML = dates.map(d=>`<button class="${d===state.activeDate?'active':''}" data-date="${d}">${d.slice(5).replace('-','/')}</button>`).join('');
}

function render(){
  ensureDay(state.activeDate);
  $('nameA').value=state.names[0]; $('nameB').value=state.names[1]; $('dayDate').value=state.activeDate;
  renderTabs();
  $('kidsWrap').innerHTML = kidCardHtml(0)+kidCardHtml(1);
  drawAllCharts();
  renderTemplateSelect();
  save();
}

function drawAllCharts(){
  [0,1].forEach(i=>{
    const canvas = document.getElementById('chart-'+i); if(!canvas) return;
    drawDonut(canvas, state.names[i], state.activeDate, normalizeRows(currentDay().kids[i].rows).segments);
  });
}

function renderTemplateSelect(){
  $('templateSelect').innerHTML = '<option value="">テンプレートを選ぶ</option>' + state.templates.map((t,idx)=>`<option value="${idx}">${esc(t.name)}</option>`).join('');
}

function save(){
  localStorage.setItem('kids_schedule_fun_v2', JSON.stringify(state));
}
function load(){
  try{ const raw=localStorage.getItem('kids_schedule_fun_v2'); if(raw){ state=JSON.parse(raw); }}catch(e){}
  state.names = state.names || ['ひろと','ゆいな'];
  state.days = state.days || {}; state.templates = state.templates || []; state.activeDate = state.activeDate || today();
}

function addRow(kidIndex){
  currentDay().kids[kidIndex].rows.push({id:uid(),action:'自由記載',custom:'',start:'05:00',duration:'0.5'}); render();
}
function sortRows(kidIndex){
  currentDay().kids[kidIndex].rows.sort((a,b)=>timeToMin(a.start)-timeToMin(b.start)); render();
}
function clearRows(kidIndex){
  currentDay().kids[kidIndex].rows=[]; render();
}
function clearDay(){
  currentDay().kids=[{rows:[]},{rows:[]}]; render();
}
function addWeekend(){
  const fri = nextFriday(); [0,1,2].forEach(offset=>ensureDay(addDays(fri,offset))); state.activeDate=fri; render();
}
function saveTemplate(){
  const name = prompt('テンプレート名を入れてください','いつもの予定'); if(!name) return;
  state.templates.push({name, kids: clone(currentDay().kids)}); render();
}
function applyTemplate(){
  const idx = $('templateSelect').value; if(idx==='') return; currentDay().kids = clone(state.templates[Number(idx)].kids); render();
}

function updateKidName(){ state.names[0]=$('nameA').value||'子どもA'; state.names[1]=$('nameB').value||'子どもB'; render(); }
function updateDate(v){ state.activeDate=v; ensureDay(v); render(); }

function drawExportPoster(){
  const W=1600,H=1220; const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f4f7ff'; ctx.fillRect(0,0,W,H);
  roundRect(ctx,28,28,W-56,H-56,30,'#ffffff');
  ctx.fillStyle='#5b6cff'; ctx.font='bold 52px sans-serif'; ctx.fillText('🌈 わくわく こどもスケジュール',56,96);
  ctx.fillStyle='#64748b'; ctx.font='26px sans-serif'; ctx.fillText(state.activeDate+'　5:00〜21:00',58,134);
  drawPosterKid(ctx, 0, 56, 170, 720, 980);
  drawPosterKid(ctx, 1, 824, 170, 720, 980);
  return canvas.toDataURL('image/jpeg',0.94);
}
function drawPosterKid(ctx, kidIndex, x, y, w, h){
  const name = state.names[kidIndex]; const norm = normalizeRows(currentDay().kids[kidIndex].rows).segments;
  roundRect(ctx,x,y,w,h,24,'#fafcff');
  ctx.fillStyle=kidIndex===0?'#4f46e5':'#ec4899'; ctx.fillRect(x,y,w,14);
  ctx.fillStyle='#1f2740'; ctx.font='bold 40px sans-serif'; ctx.fillText((kidIndex===0?'🚀 ':'🌟 ')+name,x+22,y+56);
  // donut
  const cx=x+w/2, cy=y+270, r=150, inner=74;
  let angle=-Math.PI/2,total=END_MIN-START_MIN;
  norm.forEach(seg=>{ const portion=(seg.end-seg.start)/total; const a2=angle+portion*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,a2); ctx.closePath(); ctx.fillStyle=seg.color; ctx.fill(); angle=a2;});
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#334155'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.fillText('1日の予定',cx,cy+10); ctx.textAlign='left';
  // list
  let yy=y+485;
  norm.slice(0,12).forEach(seg=>{ roundRect(ctx,x+24,yy,w-48,42,12,'#fff'); ctx.fillStyle=seg.color; ctx.beginPath(); ctx.arc(x+44,yy+21,8,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#475569'; ctx.font='22px sans-serif'; ctx.fillText(segmentText(seg),x+62,yy+28); yy+=50; });
}
function roundRect(ctx,x,y,w,h,r,fill){ ctx.beginPath(); if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r);} else { ctx.rect(x,y,w,h);} ctx.fillStyle=fill; ctx.fill(); }

// events
$('dayDate').addEventListener('change',e=>updateDate(e.target.value));
$('nameA').addEventListener('change',updateKidName); $('nameB').addEventListener('change',updateKidName);
$('saveTemplate').addEventListener('click',saveTemplate); $('applyTemplate').addEventListener('click',applyTemplate);
$('addWeekend').addEventListener('click',addWeekend); $('clearDay').addEventListener('click',clearDay);
$('renderBoth').addEventListener('click',render); $('makeJpg').addEventListener('click',()=>{ const url=drawExportPoster(); $('jpgPreview').src=url; $('jpgPreviewWrap').classList.add('show'); $('jpgPreviewWrap').scrollIntoView({behavior:'smooth'}); });
$('dayTabs').addEventListener('click',e=>{ const btn=e.target.closest('button[data-date]'); if(btn){ state.activeDate=btn.getAttribute('data-date'); render(); }});
$('kidsWrap').addEventListener('click',e=>{
  const kidBox=e.target.closest('.kid'); if(!kidBox) return; const kidIndex=Number(kidBox.getAttribute('data-kid')); const rows=currentDay().kids[kidIndex].rows;
  if(e.target.classList.contains('addRow')){ addRow(kidIndex); }
  if(e.target.classList.contains('sortRows')){ sortRows(kidIndex); }
  if(e.target.classList.contains('clearRows')){ clearRows(kidIndex); }
  if(e.target.classList.contains('deleteRow')){ const row=e.target.closest('.row'); const id=row.getAttribute('data-row'); currentDay().kids[kidIndex].rows = rows.filter(r=>r.id!==id); render(); }
});
$('kidsWrap').addEventListener('change',e=>{
  const kidBox=e.target.closest('.kid'); const rowBox=e.target.closest('.row'); if(!kidBox||!rowBox) return; const kidIndex=Number(kidBox.getAttribute('data-kid')); const rowId=rowBox.getAttribute('data-row'); const row=currentDay().kids[kidIndex].rows.find(r=>r.id===rowId); if(!row) return;
  if(e.target.classList.contains('field-action')) row.action=e.target.value;
  if(e.target.classList.contains('field-custom')) row.custom=e.target.value;
  if(e.target.classList.contains('field-start')) row.start=e.target.value;
  if(e.target.classList.contains('field-duration')) row.duration=e.target.value;
  render();
});
$('kidsWrap').addEventListener('input',e=>{
  const kidBox=e.target.closest('.kid'); const rowBox=e.target.closest('.row'); if(!kidBox||!rowBox) return; const kidIndex=Number(kidBox.getAttribute('data-kid')); const rowId=rowBox.getAttribute('data-row'); const row=currentDay().kids[kidIndex].rows.find(r=>r.id===rowId); if(!row) return;
  if(e.target.classList.contains('field-custom')){ row.custom=e.target.value; drawAllCharts(); save(); }
});

load();
$('dayDate').value = state.activeDate || today();
if(!state.activeDate) state.activeDate=today();
ensureDay(state.activeDate);
render();
})();
</script>
</body>
</html>
